name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    name: Check Website Requirements
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Check required files exist (index.html, style.css, script.js)
        run: |
          echo "=========================================================="
          echo "BƯỚC 1: KIỂM TRA SỰ TỒN TẠI CỦA 3 FILE BẮT BUỘC"
          echo "=========================================================="
          MISSING_FILES=0
          for file in index.html style.css script.js; do
            if [ ! -f "$file" ]; then
              echo "❌ THẤT BẠI: Không tìm thấy file $file!"
              MISSING_FILES=$((MISSING_FILES + 1))
            else
              echo "✅ THÀNH CÔNG: Đã tìm thấy file $file."
            fi
          done

          if [ $MISSING_FILES -gt 0 ]; then
            echo "❌ Pipeline dừng: Thiếu $MISSING_FILES file bắt buộc!"
            exit 1
          fi
          echo "🎉 Đạt yêu cầu: Đầy đủ 3 file."

      - name: Check index.html contains <title> tag
        run: |
          echo "=========================================================="
          echo "BƯỚC 2: KIỂM TRA THẺ <title> TRONG FILE index.html"
          echo "=========================================================="
          if grep -qi "<title>" index.html && grep -qi "</title>" index.html; then
            TITLE_CONTENT=$(grep -i "<title>" index.html)
            echo "✅ THÀNH CÔNG: Đã tìm thấy thẻ <title> trong index.html!"
            echo "Nội dung thẻ: $TITLE_CONTENT"
          else
            echo "❌ THẤT BẠI: File index.html không chứa thẻ <title> hợp lệ!"
            echo "Pipeline bị dừng để ngăn chặn triển khai website thiếu tiêu đề."
            exit 1
          fi

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
